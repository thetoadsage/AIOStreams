name: Publish metadata reliability image

on:
  push:
    branches: [metadata-reliability]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: metadata-image-${{ github.sha }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'thetoadsage/AIOStreams'
    uses: ./.github/workflows/build.yml

  publish:
    needs: validate
    if: github.repository == 'thetoadsage/AIOStreams' && github.ref == 'refs/heads/metadata-reliability'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Resolve image identity
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          image="ghcr.io/${REPOSITORY,,}:sha-${COMMIT}"
          echo "ref=$image" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Preserve existing commit tags
        id: existing
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          if docker buildx imagetools inspect "$IMAGE" >/dev/null 2>registry-check.log; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
            echo 'Commit image already exists; it will not be overwritten.'
          elif grep -Eqi 'not found|manifest unknown|name unknown' registry-check.log; then
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          else
            cat registry-check.log >&2
            exit 1
          fi
      - uses: actions/setup-node@v7
        if: steps.existing.outputs.exists != 'true'
        with:
          node-version: 24
      - name: Generate build metadata
        if: steps.existing.outputs.exists != 'true'
        env:
          COMMIT: ${{ github.sha }}
        run: node scripts/generateMetadata.cjs --channel=dev --ref=metadata-reliability --commit="$COMMIT"
      - name: Build the image before publishing
        if: steps.existing.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.image.outputs.ref }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=sha-${{ github.sha }}
          cache-from: type=gha,scope=metadata-reliability-amd64
          cache-to: type=gha,mode=max,scope=metadata-reliability-amd64
      - name: Smoke-test the built container and SQLite startup
        if: steps.existing.outputs.exists != 'true'
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          SECRET_KEY=$(openssl rand -hex 32)
          echo "::add-mask::$SECRET_KEY"
          export SECRET_KEY
          docker run -d --name aiostreams-ci \
            --mount type=tmpfs,destination=/app/data \
            -p 127.0.0.1:3001:3000 \
            -e SECRET_KEY -e NODE_ENV=production \
            -e BASE_URL=http://localhost:3001 \
            -e INTERNAL_URL=http://127.0.0.1:3000 \
            -e DATABASE_URI=sqlite:///app/data/staging.sqlite \
            "$IMAGE"
          for attempt in $(seq 1 36); do
            if curl -fsS http://127.0.0.1:3001/api/v1/status >/dev/null; then
              docker exec aiostreams-ci /nodejs/bin/node /app/scripts/healthcheck.js
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' aiostreams-ci)" != true ]; then break; fi
            sleep 5
          done
          docker logs aiostreams-ci
          exit 1
      - name: Publish the tested image
        if: steps.existing.outputs.exists != 'true'
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        run: docker push "$IMAGE"
      - name: Verify registry publication and record immutable digest
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
          COMMIT: ${{ github.sha }}
        run: |
          docker pull "$IMAGE"
          revision=$(docker image inspect -f '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$IMAGE")
          test "$revision" = "$COMMIT"
          digest=$(docker image inspect -f '{{index .RepoDigests 0}}' "$IMAGE")
          printf 'Image: `%s`\n\nDeploy by digest: `%s`\n' "$IMAGE" "$digest" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$IMAGE" "$digest" > image-reference.txt
      - uses: actions/upload-artifact@v7
        with:
          name: image-reference-${{ github.sha }}
          path: image-reference.txt
          retention-days: 90
      - name: Remove test container
        if: always()
        run: docker rm -f aiostreams-ci || true
